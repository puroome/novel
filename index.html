<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonder 독서 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 부드러운 화면 전환을 위한 애니메이션 효과 */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">

    <!-- 메인 컨테이너 -->
    <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 sm:p-10 fade-in" id="app-container">

        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="text-center py-4">
            <img src="assets/wonder.webp" alt="Wonder" class="h-48 sm:h-56 w-auto mx-auto mb-6 rounded-lg shadow-lg">

            <h1 class="text-3xl sm:text-4xl font-bold text-blue-800 mb-8">QUIZ for WONDER</h1>

            <button id="start-btn" onclick="startQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold py-4 px-10 rounded-xl shadow-md hover:shadow-lg transition duration-200">
                Start Quiz
            </button>

            <p class="text-sm text-gray-500 mt-6 min-h-[1.25rem]" id="start-status"></p>
        </div>

        <!-- 2. 챕터 선택 화면 -->
        <div id="chapter-screen" class="hidden">
            <h2 class="text-2xl font-bold text-blue-800 mb-6 text-center">Select a chapter to start the quiz.</h2>
            <div id="chapter-list" class="space-y-3 max-h-96 overflow-y-auto pr-2">
                <!-- 자바스크립트로 챕터 버튼들이 여기에 생성됩니다 -->
            </div>
        </div>

        <!-- 3. 퀴즈 화면 -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center gap-3 mb-6 border-b pb-4">
                <div class="flex items-center gap-3 min-w-0">
                    <button onclick="goToChapters()" aria-label="챕터 선택으로 돌아가기" title="챕터 선택으로 돌아가기" class="shrink-0 flex items-center justify-center w-10 h-10 rounded-xl bg-slate-800 text-white shadow-md hover:bg-blue-600 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 active:scale-95 transition duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 11.5 12 3l9 8.5"/>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5.5 10v10a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V10"/>
                        </svg>
                    </button>
                    <h2 id="current-chapter-title" class="text-xl font-bold text-blue-800 truncate">챕터 제목</h2>
                </div>
                <span id="progress-text" class="shrink-0 text-gray-500 font-medium">1 / 5</span>
            </div>

            <!-- 문제 번호와 본문을 나눠 두면, 줄바꿈된 다음 줄이 번호 뒤에 맞춰 들여쓰기됩니다. -->
            <div class="flex gap-2 text-lg font-bold text-gray-800 mb-6 leading-relaxed">
                <span id="question-id" class="shrink-0">[Q1]</span>
                <span id="question-text">질문이 여기에 표시됩니다.</span>
            </div>

            <div id="options-container" class="space-y-3">
                <!-- 선택지 버튼들이 여기에 생성됩니다 -->
            </div>

            <div id="explanation-box" class="mt-6 p-4 rounded-lg hidden">
                <p id="explanation-text" class="text-gray-700 font-medium"></p>
            </div>

            <div class="mt-8 text-right">
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                    다음 문제 ➔
                </button>
            </div>
        </div>

        <!-- 4. 결과 화면 -->
        <div id="result-screen" class="hidden text-center py-8">
            <h2 class="text-3xl font-bold text-blue-800 mb-4">🎉 챕터 완료!</h2>
            <p class="text-xl text-gray-700 mb-8">총 <span id="total-score" class="font-bold text-blue-600">0</span>문제를 맞혔습니다!</p>
            <button onclick="showScreen('chapter-screen')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition duration-200">
                다른 챕터 고르기
            </button>
        </div>

    </div>

    <script>
        // 퀴즈 마크다운(.md) 파일들이 들어 있는 폴더 이름입니다.
        const QUIZ_DIR = 'quizzes';

        // 전역 변수: 파싱된 전체 데이터와 현재 진행 상태를 저장합니다.
        let allChapters = [];
        let currentChapterIndex = 0;
        let currentQuestionIndex = 0;
        let score = 0;
        let quizLoadPromise = null; // 퀴즈 파일을 미리 받아 두는 작업

        // --- [1단계] 화면 전환 로직 ---
        function showScreen(screenId) {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('chapter-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            const screen = document.getElementById(screenId);
            screen.classList.remove('hidden');
            // 애니메이션 재시작을 위한 트릭
            screen.classList.remove('fade-in');
            void screen.offsetWidth;
            screen.classList.add('fade-in');
        }

        // --- [2단계] 퀴즈 파일 목록 찾기 ---
        // GitHub Pages 주소에서 저장소 정보를 알아냅니다.
        // 예: https://puroome.github.io/wonder/ → owner: puroome, repo: wonder
        function detectGitHubRepo() {
            const hostMatch = location.hostname.match(/^([^.]+)\.github\.io$/i);
            if (!hostMatch) return null;

            const owner = hostMatch[1];
            const segments = location.pathname.split('/').filter(Boolean);
            // 사용자 페이지(주소 맨 끝이 github.io)는 저장소 이름이 호스트명과 같습니다.
            const repo = segments.length > 0 ? segments[0] : location.hostname;
            return { owner, repo };
        }

        // GitHub API로 폴더 안의 .md 파일 목록을 그대로 읽어옵니다.
        // 이렇게 하면 저장소에 md 파일을 새로 넣기만 해도 목록이 자동으로 갱신됩니다.
        async function listFilesFromGitHub() {
            const repoInfo = detectGitHubRepo();
            if (!repoInfo) return null;

            const apiUrl = `https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/${QUIZ_DIR}`;
            const res = await fetch(apiUrl);
            if (!res.ok) return null;

            const items = await res.json();
            if (!Array.isArray(items)) return null;

            return items
                .filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.md'))
                .map(item => item.name);
        }

        // GitHub API를 쓸 수 없을 때(로컬 실행, 접속 제한 등) manifest.json으로 대신합니다.
        async function listFilesFromManifest() {
            const res = await fetch(`${QUIZ_DIR}/manifest.json`, { cache: 'no-cache' });
            if (!res.ok) throw new Error('퀴즈 목록 파일(manifest.json)을 찾을 수 없습니다.');

            const manifest = await res.json();
            return Array.isArray(manifest.files) ? manifest.files : [];
        }

        async function listQuizFiles() {
            try {
                const names = await listFilesFromGitHub();
                if (names && names.length > 0) return names;
            } catch (error) {
                console.warn('GitHub 목록 조회에 실패해 manifest.json으로 대체합니다.', error);
            }
            return await listFilesFromManifest();
        }

        // --- [3단계] 퀴즈 파일 불러오기 ---
        // 퀴즈 파일을 모두 읽어 챕터 배열로 만들어 돌려줍니다.
        async function fetchAllChapters() {
            let fileNames = await listQuizFiles();

            if (fileNames.length === 0) {
                throw new Error(`'${QUIZ_DIR}' 폴더에 마크다운(.md) 파일이 없습니다.`);
            }

            // 파일 이름 속 숫자를 기준으로 정렬합니다. (1-5 → 6-10 → 11-15)
            fileNames.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

            const contents = await Promise.all(fileNames.map(async (name) => {
                const res = await fetch(`${QUIZ_DIR}/${encodeURIComponent(name)}`, { cache: 'no-cache' });
                if (!res.ok) throw new Error(`'${name}' 파일을 불러오지 못했습니다.`);
                return await res.text();
            }));

            const chapters = parseMarkdownFiles(contents);

            if (chapters.length === 0) {
                throw new Error('퀴즈 데이터를 찾을 수 없습니다. 마크다운 파일의 양식을 확인해 주세요.');
            }

            return chapters;
        }

        // 시작 화면이 떠 있는 동안 미리 파일을 받아 둡니다.
        // 그래서 'Start Quiz'를 누르면 대개 기다림 없이 바로 넘어갑니다.
        function prefetchQuizzes() {
            quizLoadPromise = fetchAllChapters();
            quizLoadPromise.catch(() => {}); // 버튼을 누를 때 오류를 처리하므로 여기서는 넘어갑니다.
        }

        // --- 'Start Quiz' 버튼 ---
        async function startQuiz() {
            const btn = document.getElementById('start-btn');
            const statusText = document.getElementById('start-status');

            btn.disabled = true;
            btn.classList.add('opacity-60', 'cursor-not-allowed');
            statusText.classList.remove('text-red-600');
            statusText.classList.add('text-gray-500');
            statusText.innerText = '퀴즈를 불러오는 중입니다...';

            try {
                if (!quizLoadPromise) prefetchQuizzes();
                allChapters = await quizLoadPromise;

                statusText.innerText = '';
                renderChapterList();
                showScreen('chapter-screen');

            } catch (error) {
                console.error('퀴즈 불러오기 오류:', error);
                quizLoadPromise = null; // 버튼을 다시 누르면 새로 시도합니다.

                statusText.classList.remove('text-gray-500');
                statusText.classList.add('text-red-600');
                statusText.innerText = describeLoadError(error);
                btn.innerText = '다시 시도';

            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-60', 'cursor-not-allowed');
            }
        }

        function describeLoadError(error) {
            if (location.protocol === 'file:') {
                return 'HTML 파일을 더블클릭해서 열면 브라우저 보안 정책 때문에 퀴즈 파일을 읽을 수 없습니다. 웹 주소(https://)로 접속해 주세요.';
            }
            return `퀴즈를 불러오지 못했습니다. ${error.message || '알 수 없는 오류가 발생했습니다.'}`;
        }

        // 퀴즈를 풀던 중에 챕터 선택 화면으로 돌아갑니다.
        function goToChapters() {
            showScreen('chapter-screen');
        }

        // --- [4단계] 마크다운 텍스트 파싱 (핵심 로직) ---
        function parseMarkdownFiles(fileContents) {
            let parsedChapters = [];

            fileContents.forEach(content => {
                // 1. 문제 영역과 해설 영역 분리 (정규표현식 대소문자 무시, 공백 허용)
                const parts = content.split(/##\s*🔑\s*정답\s*및\s*해설/i);
                const mainPart = parts[0];
                const answerPart = parts[1] || "";

                // 2. 해설 영역(answerPart)에서 정답과 해설 추출하여 딕셔너리 생성
                let answerDict = {};
                const answerBlocks = answerPart.split(/\*\s*\*\*\[Q/);

                for (let i = 1; i < answerBlocks.length; i++) {
                    let block = answerBlocks[i];
                    // 문제 번호 추출 (예: 1])
                    let qNumMatch = block.match(/^(\d+)\]/);
                    if (!qNumMatch) continue;
                    let qId = "Q" + qNumMatch[1];

                    // 정답 번호 추출 (①~⑤)
                    let ansMatch = block.match(/정답:\s*([①②③④⑤])/);
                    let ansChar = ansMatch ? ansMatch[1] : null;
                    const circleNumbers = {'①':0, '②':1, '③':2, '④':3, '⑤':4};
                    let answerIndex = ansChar ? circleNumbers[ansChar] : 0;

                    // 해설 텍스트 추출 (다음 문제 시작 전까지)
                    let expMatch = block.match(/\*\s*\*해설\*:\s*([\s\S]*?)(?=(?:\n\* \*\*\[Q|$))/);
                    let explanation = expMatch ? expMatch[1].trim() : "해설이 제공되지 않았습니다.";

                    answerDict[qId] = { answerIndex, explanation };
                }

                // 3. 문제 영역(mainPart)에서 챕터와 문제 추출
                const chapterBlocks = mainPart.split(/##\s*📖\s*(Chapter.*)/i);

                for (let i = 1; i < chapterBlocks.length; i += 2) {
                    // replace() 함수를 사용하여 괄호 안의 내용(한글 해석)을 지우고 깔끔하게 다듬습니다.
                    let chapterTitle = chapterBlocks[i].replace(/\s*\([^)]*\)/g, '').trim();
                    let chapterContent = chapterBlocks[i+1];
                    let currentChapter = { title: chapterTitle, questions: [] };

                    const questionBlocks = chapterContent.split(/\[(Q\d+)\]/);

                    for (let j = 1; j < questionBlocks.length; j += 2) {
                        let qId = questionBlocks[j];
                        let qBody = questionBlocks[j+1];
                        let qLines = qBody.trim().split('\n');

                        let questionText = "";
                        let options = [];

                        qLines.forEach(line => {
                            line = line.trim();
                            // 선택지 추출 (① 기호 등으로 시작하는 줄)
                            if (/^[①②③④⑤]/.test(line)) {
                                options.push(line.substring(1).trim());
                            } else if (line.length > 0) {
                                questionText += line + " ";
                            }
                        });

                        let ansInfo = answerDict[qId] || { answerIndex: 0, explanation: "정답 정보를 찾을 수 없습니다." };

                        if (options.length > 0) {
                            currentChapter.questions.push({
                                id: qId,
                                question: questionText.trim(),
                                options: options,
                                answerIndex: ansInfo.answerIndex,
                                explanation: ansInfo.explanation
                            });
                        }
                    }

                    if (currentChapter.questions.length > 0) {
                        parsedChapters.push(currentChapter);
                    }
                }
            });

            return sortChapters(parsedChapters);
        }

        // 제목의 'Chapter 숫자'를 기준으로 챕터 순서를 정리합니다.
        // 숫자가 없는 챕터가 하나라도 있으면 원래 순서를 그대로 둡니다.
        function sortChapters(chapters) {
            const numbers = chapters.map(ch => {
                const match = ch.title.match(/Chapter\s*(\d+)/i);
                return match ? parseInt(match[1], 10) : null;
            });

            if (numbers.some(n => n === null)) return chapters;

            return chapters
                .map((chapter, index) => ({ chapter, number: numbers[index] }))
                .sort((a, b) => a.number - b.number)
                .map(item => item.chapter);
        }

        // --- [5단계] 챕터 목록 생성 로직 ---
        function renderChapterList() {
            const listContainer = document.getElementById('chapter-list');
            listContainer.innerHTML = ''; // 기존 목록 초기화

            allChapters.forEach((chapter, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-white border-2 border-blue-100 hover:border-blue-500 hover:bg-blue-50 p-4 rounded-xl transition duration-200 flex justify-between items-center group";
                btn.innerHTML = `
                    <span class="font-bold text-gray-800 group-hover:text-blue-700">${chapter.title}</span>
                    <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">${chapter.questions.length} 문제</span>
                `;
                btn.onclick = () => startChapter(index);
                listContainer.appendChild(btn);
            });
        }

        // --- [6단계] 퀴즈 실행 로직 ---
        function startChapter(index) {
            currentChapterIndex = index;
            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('current-chapter-title').innerText = allChapters[currentChapterIndex].title;
            showScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            const chapter = allChapters[currentChapterIndex];
            const qData = chapter.questions[currentQuestionIndex];

            // 프로그레스 바 텍스트 업데이트
            document.getElementById('progress-text').innerText = `${currentQuestionIndex + 1} / ${chapter.questions.length}`;

            // 문제 번호와 본문 세팅
            document.getElementById('question-id').innerText = `[${qData.id}]`;
            document.getElementById('question-text').innerText = qData.question;

            // 선택지 버튼 생성
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-gray-50 border-2 border-gray-200 hover:bg-blue-50 hover:border-blue-400 p-4 rounded-lg font-medium text-gray-700 transition duration-200";
                btn.innerText = `${index + 1}. ${optText}`;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });

            // 해설 및 다음 버튼 초기화
            const expBox = document.getElementById('explanation-box');
            expBox.classList.add('hidden');
            expBox.classList.remove('bg-green-100', 'bg-red-100');
            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectOption(selectedIndex, buttonElement) {
            const chapter = allChapters[currentChapterIndex];
            const qData = chapter.questions[currentQuestionIndex];
            const optionsContainer = document.getElementById('options-container');
            const buttons = optionsContainer.getElementsByTagName('button');

            // 모든 버튼 비활성화 (중복 클릭 방지)
            for(let btn of buttons) {
                btn.onclick = null;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-400');
            }

            const expBox = document.getElementById('explanation-box');
            const expText = document.getElementById('explanation-text');

            // 정답 확인 로직
            if (selectedIndex === qData.answerIndex) {
                buttonElement.classList.remove('border-gray-200', 'bg-gray-50', 'opacity-50');
                buttonElement.classList.add('border-green-500', 'bg-green-50', 'text-green-800');
                expBox.classList.add('bg-green-50', 'border', 'border-green-200');
                expText.innerHTML = `<span class="font-bold text-green-700">✅ 정답입니다!</span><br><br>${qData.explanation}`;
                score++;
            } else {
                buttonElement.classList.remove('border-gray-200', 'bg-gray-50', 'opacity-50');
                buttonElement.classList.add('border-red-500', 'bg-red-50', 'text-red-800');

                // 실제 정답 버튼 표시
                buttons[qData.answerIndex].classList.remove('border-gray-200', 'bg-gray-50', 'opacity-50');
                buttons[qData.answerIndex].classList.add('border-green-500', 'bg-green-50');

                expBox.classList.add('bg-red-50', 'border', 'border-red-200');
                expText.innerHTML = `<span class="font-bold text-red-700">❌ 틀렸습니다.</span><br><br>${qData.explanation}`;
            }

            expBox.classList.remove('hidden');

            // 다음 문제 버튼 또는 완료 버튼 표시
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
            if (currentQuestionIndex === chapter.questions.length - 1) {
                nextBtn.innerText = "결과 보기 ➔";
            } else {
                nextBtn.innerText = "다음 문제 ➔";
            }
        }

        function nextQuestion() {
            const chapter = allChapters[currentChapterIndex];
            currentQuestionIndex++;

            if (currentQuestionIndex < chapter.questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('total-score').innerText = score;
            showScreen('result-screen');
        }

        // --- 시작 화면을 보여 주는 동안 퀴즈 파일을 미리 받아 둡니다 ---
        document.addEventListener('DOMContentLoaded', prefetchQuizzes);
    </script>
</body>
</html>
